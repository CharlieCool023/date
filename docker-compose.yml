services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velum
      POSTGRES_PASSWORD: velum
      POSTGRES_DB: velum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velum -d velum"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Local S3-compatible private storage (credentials and bucket names come from .env).
  storage:
    image: chrislusf/seaweedfs:3.97
    environment:
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"velum","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  storage-buckets:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      storage:
        condition: service_healthy
    environment:
      PHOTOS_BUCKET: ${STORAGE_BUCKET_PHOTOS:-velum-photos}
      SELFIES_BUCKET: ${STORAGE_BUCKET_SELFIES:-velum-selfies}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 3 &&
        for bucket in "$$PHOTOS_BUCKET" "$$SELFIES_BUCKET"; do
        echo "s3.bucket.create -name $$bucket" | weed shell -master=storage:9333; done
    restart: "no"
volumes:
  postgres_data:
  storage_data:

